name: Build and publish playable web preview
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.7 and export templates
        run: |
          curl -fL --retry 3 https://github.com/godotengine/godot/releases/download/4.7-stable/Godot_v4.7-stable_linux.x86_64.zip -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7-stable_linux.x86_64
          echo /tmp/godot >> "$GITHUB_PATH"
          curl -fL --retry 3 https://github.com/godotengine/godot/releases/download/4.7-stable/Godot_v4.7-stable_export_templates.tpz -o /tmp/templates.zip
          unzip -q /tmp/templates.zip -d /tmp/templates
          mkdir -p ~/.local/share/godot/export_templates/4.7.stable
          mv /tmp/templates/templates/* ~/.local/share/godot/export_templates/4.7.stable/
      - name: Import and export game
        run: |
          mkdir -p docs
          Godot_v4.7-stable_linux.x86_64 --headless --editor --path . --import --quit
          Godot_v4.7-stable_linux.x86_64 --headless --path . --export-release Web docs/index.html
          touch docs/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
